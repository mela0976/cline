<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src wss: https: ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; img-src data:; base-uri 'none'; form-action 'none'">
<title>Chat</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #e9eef3; --bar: #ffffff; --ink: #14181c; --dim: #5f6872; --line: #d5dbe1;
  --theirs: #ffffff; --mine: #95e36b; --mine-ink: #10240a; --accent: #06a94d; --accent-ink: #047a37; --warn: #b3261e; --warn-bg: #fdeceb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --bar: #1a2026; --ink: #e8ecef; --dim: #96a0aa; --line: #2b333b;
    --theirs: #262e36; --mine: #2f7d32; --mine-ink: #f1fbef; --accent: #39c46a; --accent-ink: #5fd68a; --warn: #ffb4ab; --warn-bg: #3a1614;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; height: 100dvh;
  background: var(--bg); color: var(--ink);
  font: 17px/1.5 system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
}
header {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: var(--bar); border-bottom: 1px solid var(--line);
}
#dot { width: 10px; height: 10px; border-radius: 50%; background: #e5a50a; flex: none; }
body[data-state="open"] #dot { background: #1faa59; }
body[data-state="closed"] #dot { background: #d93025; }
#target { font-size: 19px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status { color: var(--dim); font-size: 14px; margin-inline-start: auto; white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; }
#reset { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 6px 12px; font-size: 14px; min-height: 44px; }
#notice { margin: 0; padding: 10px 16px; background: var(--warn-bg); color: var(--warn); font-size: 15px; line-height: 1.5; }
#notice.info { background: var(--bar); color: var(--dim); border-bottom: 1px solid var(--line); }
#attach { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 50%; background: none; color: var(--dim); }
#attach:disabled { opacity: .45; cursor: default; }
#attach svg, #sticker svg { width: 26px; height: 26px; }
#sticker { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 50%; background: none; color: var(--dim); }
#sticker:disabled { opacity: .45; cursor: default; }
#stickers:modal { width: min(100vw, 560px); max-width: 100vw; height: min(72dvh, 620px); margin: auto auto 0; padding: 0; border-radius: 16px 16px 0 0; }
#stickers[open] { display: flex; flex-direction: column; }
#st-cats { display: flex; gap: 6px; overflow-x: auto; padding: 12px 12px 8px; flex: none; scrollbar-width: none; }
#st-cats button { flex: none; width: auto; min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 17px; background: none; color: var(--ink); font-weight: 400; font-size: 14px; }
#st-cats button[aria-pressed="true"] { background: var(--ink); color: var(--bar); border-color: var(--ink); }
#st-grid { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px 12px; align-content: start; }
#st-grid button { width: auto; min-height: 0; padding: 4px; border: 2px solid transparent; border-radius: 12px; background: #fff; overflow: hidden; }
#st-grid button[aria-pressed="true"] { border-color: var(--accent); }
#st-grid img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; }
#st-grid p { grid-column: 1 / -1; text-align: center; color: var(--dim); font-size: 14px; margin: 24px 0; }
#st-more { grid-column: 1 / -1; width: auto; min-height: 36px; margin: 6px auto 10px; padding: 0 16px; border: 1px solid var(--line); border-radius: 18px; background: none; color: var(--dim); font-weight: 400; font-size: 13px; }
#st-bar { display: flex; gap: 8px; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex: none; }
#st-bar button { min-height: 44px; border-radius: 22px; }
#st-close { width: 44px; flex: none; background: none; color: var(--dim); border: 1px solid var(--line); font-weight: 400; }
#st-send:disabled { opacity: .45; cursor: default; }
#log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 12px 14px; }
#list { display: flex; flex-direction: column; gap: 8px; }
#back { flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: -6px 0 -6px -8px; border: 0; background: none; font-size: 30px; line-height: 1; padding: 0 0 4px; }
#back:disabled { opacity: .45; cursor: default; }
body[data-view="list"] #back, body[data-view="list"] #log, body[data-view="list"] #composer, body[data-view="chat"] #chats { display: none; }
#chats { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); }
#chats-bar { display: flex; justify-content: flex-end; padding: 8px 12px 0; }
#chats-refresh { border: 1px solid var(--line); background: var(--bar); color: var(--dim); border-radius: 22px; padding: 4px 18px; font-size: 14px; min-height: 44px; }
#chats-refresh:disabled { opacity: .55; cursor: default; }
#chat-list { list-style: none; margin: 0; padding: 0; }
#chat-list li { border-bottom: 1px solid var(--line); }
.chat-row { display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 88px; padding: 14px 16px; border: 0; background: var(--bar); text-align: start; }
.chat-row:disabled { opacity: .5; cursor: default; }
.chat-row[aria-busy="true"] { opacity: 1; background: var(--bg); }
.cr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cr-name { font-size: 17px; line-height: 1.35; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-last { color: var(--dim); font-size: 15px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-side { flex: none; align-self: flex-start; padding-top: 3px; }
.cr-time { color: var(--dim); font-size: 13px; white-space: nowrap; }
.cr-unread { color: var(--dim); font-size: 14px; line-height: 1.4; }
.cr-unread[data-has="true"] { color: var(--accent-ink); font-weight: 700; }
#chat-empty { margin: 48px 14px; text-align: center; color: var(--dim); font-size: 15px; }
#more { display: block; margin: 0 auto 12px; border: 1px solid var(--line); background: var(--bar); color: var(--dim); border-radius: 20px; padding: 6px 16px; font-size: 14px; min-height: 40px; }
#more:disabled { cursor: default; opacity: .7; }
.msg {
  max-width: 78%; padding: 10px 14px; border-radius: 18px; line-height: 1.55;
  white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgb(0 0 0 / .08);
}
.msg.left { align-self: flex-start; background: var(--theirs); border-top-left-radius: 4px; }
.msg.right { align-self: flex-end; background: var(--mine); color: var(--mine-ink); border-top-right-radius: 4px; }
/* LINE 的系統訊息（「您已收回訊息」等）：置中的小灰字，不能長按 */
.msg.center { align-self: center; max-width: 90%; padding: 2px 12px; background: rgb(0 0 0 / .08); color: var(--dim); font-size: 13px; box-shadow: none; border-radius: 12px; }
.msg.media { padding: 0; overflow: hidden; background: var(--line); box-shadow: none; border-radius: 12px; }
.msg.media img { display: block; width: 100%; height: 100%; object-fit: cover; }
#composer {
  display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  background: var(--bar); border-top: 1px solid var(--line);
}
#text {
  flex: 1; width: 100%; height: auto; field-sizing: content; min-block-size: 42px; max-block-size: 6lh; resize: none;
  font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px;
}
#send { border: 0; border-radius: 20px; min-width: 64px; min-height: 42px; background: var(--accent); color: #fff; font-weight: 600; }
#send:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
dialog { border: 0; border-radius: 16px; padding: 22px; width: min(92vw, 380px); background: var(--bar); color: var(--ink); }
dialog:modal { overscroll-behavior: contain; }
dialog::backdrop { background: rgb(0 0 0 / .5); overflow: hidden; overscroll-behavior: contain; }
dialog h1 { font-size: 18px; margin: 0 0 16px; }
dialog label { display: block; font-size: 15px; color: var(--dim); margin-bottom: 14px; }
dialog input {
  display: block; width: 100%; margin-top: 6px; padding: 11px 12px; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
dialog button { width: 100%; min-height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
.msg { -webkit-touch-callout: none; }
.msg.pressing, .msg.sel { -webkit-user-select: none; user-select: none; }
.msg.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
#paste-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; background: var(--bar); border-top: 1px solid var(--line); }
#paste-bar[hidden], #file-bar[hidden], #reply-bar[hidden], #msg-menu[hidden] { display: none; }
body[data-view="list"] #paste-bar, body[data-view="list"] #file-bar, body[data-view="list"] #reply-bar { display: none; }
/* 回覆列：樣式比照貼上列，左側加一條強調色邊 */
#reply-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; background: var(--bar); border-top: 1px solid var(--line); }
#reply-chip { flex: 1; min-width: 0; line-height: 44px; height: 44px; padding: 0 14px; border-inline-start: 4px solid var(--accent); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#reply-x { flex: none; width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: none; color: var(--dim); font-size: 16px; }
/* 收到的檔案（📄 開頭的文字氣泡）：檔名加粗、可點擊 */
.msg.file { cursor: pointer; font-weight: 600; }
/* 檔案下載連結列：樣式比照貼上列 */
#file-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; background: var(--bar); border-top: 1px solid var(--line); }
#file-link { flex: 1; min-width: 0; display: block; line-height: 44px; height: 44px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 22px; background: var(--bg); color: var(--accent-ink); font-size: 15px; font-weight: 600; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#file-x { flex: none; width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: none; color: var(--dim); font-size: 16px; }
#paste-chip { flex: 1; min-width: 0; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--bg); color: var(--ink); text-align: start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
#paste-chip:disabled { opacity: .45; cursor: default; }
#paste-x { flex: none; width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: none; color: var(--dim); font-size: 16px; }
#msg-menu { position: fixed; z-index: 50; min-width: 150px; max-width: calc(100vw - 16px); padding: 4px; background: var(--bar); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 24px rgb(0 0 0 / .28); }
#msg-menu button { display: block; width: 100%; min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: none; color: var(--ink); text-align: start; font-size: 17px; }
#msg-menu button:hover, #msg-menu button:focus-visible { background: var(--bg); }
#msg-menu button:disabled { opacity: .45; cursor: default; }
#fwd:modal { width: min(92vw, 420px); max-height: min(80dvh, 560px); padding: 0; }
#fwd[open] { display: flex; flex-direction: column; }
#fwd h1 { margin: 0; padding: 18px 18px 8px; }
#fwd-list { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
#fwd-list li { border-top: 1px solid var(--line); }
#fwd .chat-row { color: var(--ink); font-weight: 400; border-radius: 0; }
#fwd-empty { margin: 24px 18px; text-align: center; color: var(--dim); font-size: 15px; }
#fwd-cancel { flex: none; width: auto; margin: 10px 12px; margin-bottom: max(10px, env(safe-area-inset-bottom)); background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
/* 圖片檢視器：全螢幕黑底，圖片 contain；放大時可捲動 */
.msg.media:has(img) { cursor: zoom-in; }
#viewer:modal { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; border-radius: 0; background: #000; color: #fff; overflow: hidden; }
#viewer::backdrop { background: #000; }
#viewer-scroll { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; touch-action: pinch-zoom; }
#viewer-scroll.zoomed { touch-action: pan-x pan-y pinch-zoom; }
#viewer-img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-user-select: none; user-select: none; }
#viewer-scroll.zoomed #viewer-img { width: 200%; height: 200%; }
#viewer-x { position: fixed; z-index: 2; top: max(8px, env(safe-area-inset-top)); inset-inline-end: 8px; width: 44px; height: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 50%; background: rgb(0 0 0 / .55); color: #fff; font-size: 20px; font-weight: 400; }
#viewer-cap { position: fixed; z-index: 2; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0; padding: 4px 14px; border-radius: 16px; background: rgb(0 0 0 / .6); color: #ddd; font-size: 13px; line-height: 1.5; white-space: nowrap; pointer-events: none; }
#viewer-cap[hidden] { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
/* 即時回饋：樂觀氣泡、開啟中、按下效果 */
#pending-list { display: flex; flex-direction: column; gap: 8px; }
#pending-list:not(:empty) { margin-top: 8px; }
.msg.sending { opacity: .6; }
#opening { display: none; margin: 40px 0; text-align: center; color: var(--dim); font-size: 15px; }
body[data-opening="true"] #opening { display: block; }
body[data-opening="true"] #more { display: none; }
#msg-menu button[hidden] { display: none; }
/* 多選模式：底部列取代輸入列，氣泡前面出現勾選圈 */
#sel-bar { display: none; align-items: center; gap: 8px; padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--bar); border-top: 1px solid var(--line); }
body[data-select="true"] #sel-bar { display: flex; }
body[data-select="true"] #composer, body[data-select="true"] #paste-bar, body[data-select="true"] #file-bar, body[data-select="true"] #reply-bar { display: none; }
#sel-count { flex: 1; min-width: 0; font-weight: 600; }
#sel-bar button { min-height: 44px; min-width: 64px; padding: 0 16px; border: 1px solid var(--line); border-radius: 22px; background: none; color: var(--ink); }
#sel-bar #sel-fwd { border: 0; background: var(--accent); color: #fff; font-weight: 600; }
#sel-bar button:disabled { opacity: .45; cursor: default; }
body[data-select="true"] .msg { position: relative; cursor: pointer; -webkit-user-select: none; user-select: none; }
body[data-select="true"] .msg:not(.media) { padding-inline-start: 38px; }
body[data-select="true"] .msg::after { content: ""; position: absolute; top: 6px; inset-inline-start: 6px; width: 22px; height: 22px; box-sizing: border-box; border: 2px solid var(--dim); border-radius: 50%; background: var(--bar); }
body[data-select="true"] .msg.checked { outline: 2px solid var(--accent); outline-offset: 2px; }
body[data-select="true"] .msg.checked::after { content: "✓"; display: grid; place-items: center; border-color: var(--accent); background: var(--accent); color: #fff; font-size: 14px; line-height: 1; }
/* 去除 300 ms 點擊延遲，並加上按下的視覺回饋 */
button, a, input, textarea, label, .msg, .chat-row { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { transition: transform .06s ease-out, background-color .06s; }
button:active:not(:disabled) { transform: scale(.96); filter: brightness(.9); }
.chat-row:active:not(:disabled) { transform: none; background: var(--bg); filter: none; }
#msg-menu button:active:not(:disabled) { transform: none; background: var(--line); filter: none; }
.msg:active { filter: brightness(.95); }
</style>
</head>
<body data-state="connecting" data-view="list">
<header>
  <span id="dot" aria-hidden="true"></span>
  <button id="back" type="button" aria-label="返回聊天列表" disabled>‹</button>
  <span id="target">聊天</span>
  <span id="status" role="status">連線中</span>
  <button id="reset" type="button">重設連線</button>
</header>
<p id="notice" role="alert" hidden></p>
<section id="chats" aria-label="聊天列表">
  <div id="chats-bar"><button id="chats-refresh" type="button">重新整理</button></div>
  <ul id="chat-list"></ul>
  <p id="chat-empty" hidden>沒有可選的聊天室</p>
</section>
<main id="log">
  <button id="more" type="button">載入更早訊息</button>
  <div id="list" aria-live="polite"></div>
  <div id="pending-list" aria-hidden="true"></div>
  <p id="opening" role="status">開啟中…</p>
</main>
<div id="paste-bar" hidden>
  <button id="paste-chip" type="button"></button>
  <button id="paste-x" type="button" aria-label="清除剪貼內容">✕</button>
</div>
<div id="file-bar" hidden>
  <a id="file-link" target="_blank" rel="noopener"></a>
  <button id="file-x" type="button" aria-label="關閉檔案連結">✕</button>
</div>
<div id="reply-bar" hidden>
  <span id="reply-chip"></span>
  <button id="reply-x" type="button" aria-label="取消回覆">✕</button>
</div>
<form id="composer">
  <button id="attach" type="button" aria-label="傳送照片" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <input id="file" type="file" accept="image/*" hidden>
  <button id="sticker" type="button" aria-label="LINE 貼圖" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
  </button>
  <label class="sr" for="text">訊息</label>
  <textarea id="text" rows="1" maxlength="1000" enterkeyhint="send" autocomplete="off"></textarea>
  <button id="send" type="submit" disabled>傳送</button>
</form>
<div id="sel-bar">
  <span id="sel-count" role="status">已選 0 則</span>
  <button id="sel-fwd" type="button" disabled>轉傳</button>
  <button id="sel-cancel" type="button">取消</button>
</div>

<dialog id="stickers" aria-label="LINE 貼圖" closedby="any">
  <div id="st-cats" role="toolbar" aria-label="分類"></div>
  <div id="st-grid"></div>
  <div id="st-bar">
    <button id="st-close" type="button" aria-label="關閉">✕</button>
    <button id="st-send" type="button" disabled>傳送</button>
  </div>
</dialog>

<div id="msg-menu" role="menu" aria-label="訊息操作" hidden>
  <button type="button" role="menuitem" data-act="reply">回覆</button>
  <button type="button" role="menuitem" data-act="copy">複製</button>
  <button type="button" role="menuitem" data-act="fwd">轉傳</button>
  <button type="button" role="menuitem" data-act="select">選取</button>
  <button type="button" role="menuitem" data-act="unsend" hidden>收回</button>
  <button type="button" role="menuitem" data-act="cancel">取消</button>
</div>

<dialog id="fwd" aria-labelledby="fwd-title" closedby="any">
  <h1 id="fwd-title">轉傳到…</h1>
  <ul id="fwd-list"></ul>
  <p id="fwd-empty" hidden>沒有其他聊天室可轉傳</p>
  <button id="fwd-cancel" type="button">取消</button>
</dialog>

<dialog id="viewer" aria-label="檢視圖片" closedby="any">
  <div id="viewer-scroll"><img id="viewer-img" alt="圖片" draggable="false"></div>
  <button id="viewer-x" type="button" aria-label="關閉">✕</button>
  <p id="viewer-cap" role="status" hidden></p>
</dialog>

<dialog id="setup" aria-labelledby="setup-title" closedby="none">
  <form id="setup-form">
    <h1 id="setup-title">連線設定</h1>
    <label>Tunnel 網址
      <input id="f-url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="xxxx.trycloudflare.com" required autofocus>
    </label>
    <label>PIN
      <input id="f-pin" type="password" inputmode="numeric" autocomplete="off" minlength="6" required>
    </label>
    <button type="submit">連線</button>
  </form>
</dialog>

<script>
"use strict";
const KEY_URL = "sline.url", KEY_PIN = "sline.pin", KEY_CHATS = "sline.chats";
const STATUS = { connecting: "連線中", open: "已連線", closed: "斷線，自動重連中" };
const $ = (id) => document.getElementById(id);
const log = $("log"), list = $("list"), more = $("more"), text = $("text"), sendBtn = $("send"), notice = $("notice"), setup = $("setup");
const MORE_TEXT = "載入更早訊息";
const HISTORY_MSG = {
  gap: "捲動時跳過了一段，沒有接上，請再按一次。",
  not_bottom: "載入後沒能回到最新訊息，新訊息可能暫時讀不到。",
  off_target: "雲端畫面不在目標聊天室，無法載入。",
  device_error: "無法連上 Android 容器。",
  not_ready: "還沒讀到對話，稍後再試。",
};
const media = new Map();   // 圖片 id → data URL，只存在這個分頁的記憶體
const attachBtn = $("attach"), fileInput = $("file");
const MAX_UPLOAD = 95_000_000;
const stickerBtn = $("sticker"), stickerDlg = $("stickers"), stCats = $("st-cats"), stGrid = $("st-grid"), stSend = $("st-send");
let stickerCats = [], curCat = null, picked = null, stLoading = false;
const stickerCache = new Map();   // 分類 → { items: [{n, img}], more, page }

let ws = null, retry = 0, retryTimer = 0, everOpened = false, stopped = true;
let shown = [];          // 已渲染的訊息
let pending = null;      // { id, timer }：等待後端確認的那一則
let blocked = null;      // 後端回報的持續性警告（防呆鎖／裝置離線）
let seq = 0;
let clip = null;         // 頁面內剪貼簿：{ kind: "text", text } | { kind: "image", dataUrl }
let forwarding = false;  // 轉傳流程進行中
let replyTo = null;      // 回覆中的訊息：{ index, preview, el }；index 隨 reindex 更新
const waiters = [];      // handle() 最前面檢查：{ match(p), resolve, reject, timer }

function setState(state) {
  document.body.dataset.state = state;
  updateStatus();
  refreshSend();
}
// 狀態文字：開啟聊天室途中顯示「開啟中…」
function updateStatus() {
  const s = document.body.dataset.state;
  if (STATUS[s]) $("status").textContent = chatOpening && s === "open" ? "開啟中…" : STATUS[s];
}
function setOpening(on) {
  chatOpening = on;
  document.body.dataset.opening = String(on);
  updateStatus();
}
function refreshSend() {
  const busy = document.body.dataset.state !== "open" || !curTarget || !!pending || !!blocked || chatOpening;
  sendBtn.disabled = busy || forwarding || !text.value.trim();
  text.disabled = chatOpening;
  attachBtn.disabled = busy;
  stickerBtn.disabled = busy || forwarding;
  refreshSelBar();
  refreshPaste();
  refreshList();
}

// ---- 聊天列表／聊天室切換 ----
const chatListEl = $("chat-list"), chatEmpty = $("chat-empty"), backBtn = $("back"), refreshBtn = $("chats-refresh");
let curTarget = null;      // 目前開啟的聊天室 key；null = 列表模式
let chatItems = [];        // 最後收到的列表
let chatsLoaded = false;
let openingName = null;    // 正在開啟的列 key
let closing = false;       // 已送出 close，等 chat 封包
let listNotice = false;    // 目前的提示是列表產生的
let navTimer = 0;
let chatOpening = false;   // 已先切到聊天室畫面，還在等後端確認開啟
const NAV_TIMEOUT = 60000;

function startNav() {
  clearTimeout(navTimer);
  navTimer = setTimeout(() => abortOpen("後端沒有回應，請再試一次。"), NAV_TIMEOUT);
}
function endNav() { clearTimeout(navTimer); openingName = null; closing = false; if (chatOpening) setOpening(false); }
// 開啟失敗／逾時／斷線：退回列表畫面並提示
function abortOpen(message) {
  const was = chatOpening;
  endNav();
  if (was) setChat(null);
  renderChats();
  if (message) { showNotice(message); listNotice = false; }
}

function refreshList() {
  const open = document.body.dataset.state === "open";
  refreshBtn.disabled = !open || !!openingName || forwarding;
  for (const b of chatListEl.querySelectorAll(".chat-row")) b.disabled = !open || forwarding || (!!openingName && b.dataset.name !== openingName);
  backBtn.disabled = !open || closing || forwarding;
}

function renderChats() {
  const focused = chatListEl.contains(document.activeElement) ? document.activeElement.dataset.name : null;
  chatListEl.replaceChildren(...chatItems.map((c) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chat-row";
    b.dataset.name = c.name;
    const busy = openingName === c.name;
    b.setAttribute("aria-busy", String(busy));
    const main = document.createElement("div"); main.className = "cr-main";
    const name = document.createElement("div"); name.className = "cr-name"; name.textContent = c.label || c.name;
    // 名字下方：幾則未讀，再下一行是最後一則訊息
    const unread = Number(c.unread) || 0;
    const count = document.createElement("div"); count.className = "cr-unread";
    count.dataset.has = String(unread > 0);
    count.textContent = busy ? "開啟中…" : c.stale ? "更新中…" : (unread > 0 ? unread.toLocaleString() + " 則未讀" : "沒有未讀");
    const last = document.createElement("div"); last.className = "cr-last"; last.textContent = c.stale ? "" : (c.last || "（沒有讀到最後一則訊息）");
    main.append(name, count, last);
    const side = document.createElement("div"); side.className = "cr-side";
    const time = document.createElement("span"); time.className = "cr-time"; time.textContent = c.time || "";
    side.append(time);
    b.append(main, side);
    b.addEventListener("click", () => openChat(c.name, c.label || c.name));
    li.append(b);
    return li;
  }));
  chatEmpty.hidden = !chatsLoaded || chatItems.length > 0;
  if (focused) { const f = [...chatListEl.querySelectorAll(".chat-row")].find((x) => x.dataset.name === focused); if (f) f.focus(); }
  refreshList();
}

function openChat(name, label) {
  if (!ws || openingName || forwarding || document.body.dataset.state !== "open") return;
  showNotice("");
  setChat(name, label || name, true);   // 立刻切到聊天室畫面，不等後端
  openingName = name;
  setOpening(true);
  startNav();
  renderChats();
  refreshSend();
  ws.send(JSON.stringify({ type: "open", name }));
}

function clearChatState() {
  closeMenu();
  exitSelect();
  clearOptimistic();
  render([]);
  media.clear();
  more.disabled = false;
  more.textContent = MORE_TEXT;
  if (pending) { clearTimeout(pending.timer); pending = null; }
  blocked = null;
  text.value = "";
  clearReply();
  picked = null; stSend.disabled = true;
  if (stickerDlg.open) stickerDlg.close();
  closeViewer();
  clearFileState();
  showNotice("");
}

function setChat(target, label, force = false) {
  target = target || null;
  const changed = target !== curTarget;
  curTarget = target;
  if (changed || force) clearChatState();
  endNav();
  document.body.dataset.view = target ? "chat" : "list";
  $("target").textContent = target ? (label || target) : "聊天";
  document.title = target ? (label || target) : "聊天";
  renderChats();
  refreshSend();
}
function showNotice(message, info = false) {
  notice.textContent = message || "";
  notice.hidden = !message;
  notice.classList.toggle("info", !!message && info);
}

const same = (a, b) => a.side === b.side && a.text === b.text && (a.kind || "text") === (b.kind || "text") &&
  (a.media || null) === (b.media || null) && a.w === b.w && a.h === b.h;

function fillMedia(el) {
  const src = media.get(el.dataset.media);
  if (!src || el.firstChild) return;
  const img = new Image();
  img.alt = "圖片";
  img.src = src;
  el.append(img);
}

function bubble(m) {
  const el = document.createElement("div");
  el.className = "msg " + (m.side === "right" ? "right" : m.side === "center" ? "center" : "left");
  if (m.kind === "media") {
    // Android 畫面 720px 寬、2 倍密度：除以 2 即為實際顯示大小；圖片未到前先保留同樣大小的空位
    el.classList.add("media");
    el.style.width = Math.round(m.w / 2) + "px";
    el.style.aspectRatio = m.w + " / " + m.h;
    if (m.media) { el.dataset.media = m.media; fillMedia(el); }
  } else {
    el.textContent = m.text;
    if (m.text.startsWith("📄 ")) el.classList.add("file");   // 收到的檔案：可點擊取得下載連結
  }
  el.tabIndex = 0;
  el.setAttribute("aria-haspopup", "menu");
  return el;
}

function render(messages) {
  const n = shown.length;
  const prepended = n > 0 && messages.length > n && shown.every((m, i) => same(m, messages[messages.length - n + i]));
  if (prepended) {
    // 較早的訊息接在上方：維持目前看到的位置，不要跳走
    const fromBottom = log.scrollHeight - log.scrollTop;
    const frag = document.createDocumentFragment();
    for (const m of messages.slice(0, messages.length - n)) frag.append(bubble(m));
    list.prepend(frag);
    log.scrollTop = log.scrollHeight - fromBottom;
    shown = messages;
    reindex();
    return;
  }
  let keep = 0;
  while (keep < n && keep < messages.length && same(shown[keep], messages[keep])) keep++;
  while (list.children.length > keep) list.lastElementChild.remove();
  for (const m of messages.slice(keep)) list.append(bubble(m));
  const grew = messages.length > keep;
  shown = messages;
  reindex();
  if (grew) log.scrollTop = log.scrollHeight;
}
// 每次 render 後重算 data-index（往上補舊訊息時索引會位移），收回時要用
function reindex() {
  let i = 0;
  for (const el of list.children) el.dataset.index = String(i++);
  syncReply();
}

// ---- 樂觀氣泡（送出中的文字）----
const pendingList = $("pending-list");
function addOptimistic(value) {
  const el = document.createElement("div");
  el.className = "msg right sending";
  el.textContent = value;
  pendingList.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function clearOptimistic() { pendingList.replaceChildren(); }
// 移除已經出現在真正對話裡的樂觀氣泡。後端是先廣播 sync 再回 ack，所以兩個時間點都要檢查：
// 已確認（done）的，或同樣文字已出現在最後幾則自己的訊息裡的，都拿掉。
function dropConfirmedOptimistic() {
  const recent = shown.slice(-15).filter((m) => m.side === "right" && (m.kind || "text") === "text").map((m) => m.text);
  for (const el of [...pendingList.children]) {
    const i = recent.lastIndexOf(el.textContent);
    if (el.dataset.done && i >= 0) { el.remove(); recent.splice(i, 1); }
  }
}

// ---- 聊天列表名稱快取（只存名稱，不存訊息／未讀／時間）----
function saveChatNames(items) {
  try { localStorage.setItem(KEY_CHATS, JSON.stringify(items.map((c) => ({ name: c.name, label: c.label || "" })))); } catch {}
}
function loadChatNames() {
  try {
    const a = JSON.parse(localStorage.getItem(KEY_CHATS) || "[]");
    return Array.isArray(a) ? a.filter((c) => c && typeof c.name === "string" && c.name).map((c) => ({ name: c.name, label: typeof c.label === "string" ? c.label : "" })) : [];
  } catch { return []; }
}
// 載入頁面時先用快取名稱畫出列表（標示為更新中），WebSocket 連上後由真正的 chats 封包取代
function showCachedChats() {
  if (!localStorage.getItem(KEY_URL) || !localStorage.getItem(KEY_PIN)) return;
  const names = loadChatNames();
  if (!names.length) return;
  chatItems = names.map((c) => ({ ...c, stale: true }));
  chatsLoaded = true;
  renderChats();
}

function toWsBase(raw) {
  let s = raw.trim();
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
  const u = new URL(s);
  const plain = u.protocol === "http:" || u.protocol === "ws:";
  return (plain ? "ws://" : "wss://") + u.host;
}

function connect() {
  const base = localStorage.getItem(KEY_URL), pin = localStorage.getItem(KEY_PIN);
  if (!base || !pin) return openSetup();
  stopped = false;
  clearTimeout(retryTimer);
  setState("connecting");
  const sock = ws = new WebSocket(base + "/ws?pin=" + encodeURIComponent(pin));
  sock.onmessage = (ev) => { if (sock === ws) handle(JSON.parse(ev.data)); };
  sock.onclose = () => {
    if (sock !== ws || stopped) return;
    ws = null;
    failWaiters("連線中斷，轉傳已中止。");
    if (pending) settle("連線中斷，無法確認上一則是否送達，請看對話再決定是否重傳。", false);
    if (openingName || closing || chatOpening) abortOpen("");
    if (more.textContent === "載入中…") { more.disabled = false; more.textContent = MORE_TEXT; }
    if (stLoading) { stLoading = false; renderStickers(); }
    if (viewReq) finishView("顯示的是縮圖");
    if (fileReq) { clearFileReq(); showNotice("連線中斷，檔案請求已取消。"); }
    setState("closed");
    retry++;
    if (!everOpened && retry >= 3) showNotice("連不上後端，請確認 Tunnel 網址與 PIN，或按「重設連線」。");
    retryTimer = setTimeout(connect, Math.min(15000, 1000 * 2 ** Math.min(retry, 4)));
  };
}

function handle(p) {
  for (const w of waiters.slice()) if (w.match(p)) { waiters.splice(waiters.indexOf(w), 1); clearTimeout(w.timer); w.resolve(p); }
  if (p.type === "init") {
    everOpened = true; retry = 0; blocked = null;
    showNotice("");
    more.disabled = false;
    more.textContent = MORE_TEXT;
    setChat(p.target, p.label);
    setState("open");
  } else if (p.type === "chats") {
    chatItems = Array.isArray(p.items) ? p.items : [];
    chatsLoaded = true;
    if (p.code === "ok") saveChatNames(chatItems);
    renderChats();
    if (!curTarget) {
      const msg = p.code === "off_list" ? "雲端 LINE 不在聊天列表畫面。" : p.code === "device_error" ? "無法連上 Android 容器。" : "";
      if (msg) { showNotice(msg); listNotice = true; }
      else if (listNotice) { showNotice(""); listNotice = false; }
    }
  } else if (p.type === "chat") {
    // 剛按了聊天室、先前背景 close 的回應才到：忽略，免得把畫面拉回列表
    if (!p.target && chatOpening) { closing = false; return; }
    setChat(p.target, p.label);
  } else if (p.type === "open_result") {
    if (!p.ok) abortOpen(p.message || "無法開啟聊天室。");
  } else if (p.type === "sync") {
    if (curTarget && !chatOpening) { render(p.messages); dropConfirmedOptimistic(); refreshSelBar(); }
  } else if (p.type === "view") {
    onViewReply(p);
  } else if (p.type === "file") {
    onFileReply(p);
  } else if (p.type === "media") {
    media.set(p.id, p.data);
    for (const el of list.querySelectorAll("[data-media]")) if (el.dataset.media === p.id) fillMedia(el);
  } else if (p.type === "sticker_categories") {
    stickerCats = p.items || [];
    stLoading = false;
    if (!stickerCats.length) { stickerCache.set(null, { items: [], more: false, page: 0, error: "讀不到 LINE 的貼圖分類。" }); curCat = null; renderCats(); renderStickers(); }
    else pickCategory(stickerCats.includes(curCat) ? curCat : stickerCats[0]);
  } else if (p.type === "stickers") {
    stLoading = false;
    const c = stickerCache.get(p.category) || { items: [], more: true, page: -1 };
    if (p.code === "ok") {
      const have = new Set(c.items.map((i) => i.n));
      c.items.push(...p.items.filter((i) => !have.has(i.n)));
      c.more = p.more;
      c.page = p.page;
      delete c.error;
    } else {
      c.error = p.code === "device_error" ? "無法連上 Android 容器。" : "讀不到這個分類的貼圖。";
    }
    stickerCache.set(p.category, c);
    if (p.category === curCat) renderStickers();
  } else if (p.type === "history") {
    more.disabled = p.code === "no_more";
    more.textContent = p.code === "no_more" ? "沒有更早的訊息了" : MORE_TEXT;
    if (HISTORY_MSG[p.code]) showNotice(HISTORY_MSG[p.code]);
  } else if (p.type === "warning") {
    blocked = p.code;
    showNotice(p.message);
    refreshSend();
  } else if (p.type === "ready") {
    blocked = null;
    showNotice("");
    refreshSend();
  } else if (p.type === "ack" && pending && p.id === pending.id) {
    settle(p.ok ? "" : p.message, p.ok);
  }
}

// 收到 ack／逾時／斷線：結算目前等待中的那一則。cb(ok, message) 由轉傳流程使用
function settle(message, ok) {
  const p = pending;
  clearTimeout(p.timer);
  pending = null;
  if (p.kind === "text" && p.opt) {
    if (ok) {
      // 保留樂觀氣泡，等下一次 sync 畫出真訊息；保險起見 4 秒後也移除
      p.opt.dataset.done = "1";
      dropConfirmedOptimistic();   // sync 通常已經先到了，真訊息已在畫面上就立刻移除
      setTimeout(() => p.opt.remove(), 4000);
    } else {
      p.opt.remove();
      if (p.restore && !text.value) text.value = p.restore;   // 失敗：把字放回輸入框
      restoreReply(p.reply);                                  // 同時還原回覆對象
    }
  }
  if (p.cb) p.cb(ok, message);
  else if (ok && p.kind === "unsend") flash("已收回", 2500);
  else if (!blocked || message) showNotice(message);
  refreshSend();
}

// cb：轉傳流程的完成回呼；有 cb 時不清輸入框、失敗不還原文字
// reply：只有輸入框送出才會帶（{index, preview, el}）；轉傳等有 cb 的流程不帶
function sendTextNow(value, cb, reply) {
  if (!ws || !curTarget || pending || blocked || chatOpening || document.body.dataset.state !== "open") return false;
  const id = ++seq;
  const opt = addOptimistic(value);   // 立刻顯示半透明氣泡
  const quoted = !cb && reply ? reply : null;
  pending = { id, kind: "text", cb, opt, restore: cb ? "" : value, reply: quoted, timer: setTimeout(() => settle("後端沒有回應，無法確認是否送達，請看對話再決定是否重傳。", false), 15000) };
  if (!cb) { text.value = ""; showNotice(""); }
  if (quoted) clearReply();   // 一送出就收起回覆列；失敗時由 settle 還原
  refreshSend();
  const packet = { text: value, id };
  if (quoted) packet.reply_to = quoted.index;
  ws.send(JSON.stringify(packet));
  return true;
}

function httpBase() {
  return (localStorage.getItem(KEY_URL) || "").replace(/^wss:/, "https:").replace(/^ws:/, "http:");
}

function uploadAndSend(file, cb) {
  if (attachBtn.disabled || !ws) return;
  if (file.size > MAX_UPLOAD) return showNotice("檔案超過 95 MB，無法傳送。");
  const id = ++seq;
  pending = { id, kind: "media", cb, timer: 0 };
  refreshSend();
  showNotice("上傳中 0%", true);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", httpBase() + "/upload");
  xhr.setRequestHeader("x-pin", localStorage.getItem(KEY_PIN) || "");
  xhr.setRequestHeader("content-type", file.type || "application/octet-stream");
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable && pending && pending.id === id) showNotice("上傳中 " + Math.round(e.loaded / e.total * 100) + "%", true);
  };
  xhr.onload = () => {
    if (!pending || pending.id !== id) return;
    let body = {};
    try { body = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) return settle(body.message || "上傳失敗（" + xhr.status + "）。", false);
    if (!ws) return settle("連線中斷，檔案沒有送出。", false);
    showNotice("送出中…", true);
    pending.timer = setTimeout(() => settle("後端沒有回應，無法確認是否送達，請看對話再決定是否重傳。", false), 90000);
    ws.send(JSON.stringify({ type: "send_media", upload: body.id, id }));
  };
  xhr.onerror = () => { if (pending && pending.id === id) settle("上傳失敗，請檢查網路。", false); };
  xhr.send(file);
}

function renderCats() {
  stCats.replaceChildren(...stickerCats.map((name) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.setAttribute("aria-pressed", String(name === curCat));
    b.addEventListener("click", () => pickCategory(name));
    return b;
  }));
}

function renderStickers() {
  const c = stickerCache.get(curCat);
  const nodes = [];
  for (const it of c ? c.items : []) {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", curCat + " 第 " + it.n + " 張");
    b.setAttribute("aria-pressed", String(!!picked && picked.cat === curCat && picked.n === it.n));
    const img = new Image();
    img.src = it.img;
    img.alt = "";
    b.append(img);
    b.addEventListener("click", () => {
      picked = { cat: curCat, n: it.n };
      stSend.disabled = false;
      for (const x of stGrid.querySelectorAll("button[aria-pressed]")) x.setAttribute("aria-pressed", String(x === b));
    });
    nodes.push(b);
  }
  if (stLoading) {
    const p = document.createElement("p"); p.textContent = "讀取中…"; nodes.push(p);
  } else if (c && c.error) {
    const p = document.createElement("p"); p.textContent = c.error; nodes.push(p);
  } else if (c && c.more) {
    const m = document.createElement("button");
    m.id = "st-more"; m.type = "button"; m.textContent = "更多";
    m.addEventListener("click", () => requestStickers(curCat, c.page + 1));
    nodes.push(m);
  }
  stGrid.replaceChildren(...nodes);
}

function requestStickers(name, page) {
  if (!ws || stLoading) return;
  stLoading = true;
  renderStickers();
  ws.send(JSON.stringify({ type: "stickers", category: name, page }));

  const bytes = new Uint8Array(bin.length);

}

// ---- 圖片檢視器：先秀縮圖，同時向後端要較清楚的版本（不走 pending/ack，不擋傳送）----
const viewer = $("viewer"), viewerScroll = $("viewer-scroll"), viewerImg = $("viewer-img"), viewerCap = $("viewer-cap");

viewerScroll.addEventListener("click", (ev) => {

function onImage(ev) {

    b.type = "button"; b.className = "chat-row";
    const main = document.createElement("div"); main.className = "cr-main";
    const name = document.createElement("div"); name.className = "cr-name"; name.textContent = c.label || c.name;
    const last = document.createElement("div"); last.className = "cr-last"; last.textContent = c.last || "";
    main.append(name, last);
    b.append(main);
    b.addEventListener("click", () => { const its = fwdItems; fwdDlg.close(); forwardTo(its, c); });
    li.append(b);
    return li;
  }));
  fwdDlg.showModal();
}
$("fwd-cancel").addEventListener("click", () => fwdDlg.close());
if (!("closedBy" in HTMLDialogElement.prototype)) {
  const outside = (e) => { const r = fwdDlg.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
  let downOutside = false;
  fwdDlg.addEventListener("pointerdown", (e) => { downOutside = outside(e); });
  fwdDlg.addEventListener("pointerup", (e) => { if (downOutside && outside(e)) fwdDlg.close(); });
}

// 送出一個轉傳項目，等後端 ack 才 resolve；失敗 reject
function sendForwardItem(item) {
  return new Promise((resolve, reject) => {
    const cb = (ok, msg) => (ok ? resolve() : reject(new Error(msg || "傳送失敗。")));
    if (item.kind === "text") {
      if (!sendTextNow(item.text, cb)) reject(new Error("目前無法送出（後端忙碌或被鎖定）。"));
      return;
    }
    try {
      const blob = dataUrlToBlob(item.dataUrl);
      uploadAndSend(new File([blob], "forward." + (blob.type === "image/png" ? "png" : "jpg"), { type: blob.type }), cb);
      if (!pending || pending.kind !== "media" || pending.cb !== cb) reject(new Error("圖片沒有送出。"));
    } catch (e) { reject(e); }
  });
}

// items：{kind:"text"|"image", ...} 陣列（依原始順序）；先切到目標聊天室一次，再逐則送出
async function forwardTo(items, chat) {
  if (forwarding || !items.length) return;
  if (!ws || document.body.dataset.state !== "open") return showNotice("尚未連線，無法轉傳。");
  if (pending) return showNotice("請等目前的訊息送出後再轉傳。");
  const name = chat.name, label = chat.label || chat.name, n = items.length;
  const end = Date.now() + FWD_TIMEOUT;
  const step = (match, msg) => {
    const p = waitFor(match, end - Date.now());
    ws.send(JSON.stringify(msg));
    return p;
  };
  forwarding = true;
  closeMenu();
  exitSelect();
  refreshSend();
  showNotice("轉傳中…", true);
  let sent = 0, sending = false;
  try {
    await step((p) => p.type === "chat" && !p.target, { type: "close" });
    const r = await step((p) => (p.type === "chat" && p.target === name) || (p.type === "open_result" && !p.ok), { type: "open", name });
    if (r.type === "open_result") throw new Error(r.message || "無法開啟聊天室，轉傳已中止。");
    await waitFor((p) => p.type === "sync", end - Date.now());
    sending = true;
    for (; sent < n; sent++) {
      showNotice("轉傳中 " + (sent + 1) + "/" + n + "…", true);
      await sendForwardItem(items[sent]);
    }
    flash(n === 1 ? "已轉傳到 " + label : "已轉傳 " + n + " 則到 " + label);
  } catch (e) {
    const base = e && e.message ? e.message : "轉傳失敗。";
    showNotice(sending ? "第 " + (sent + 1) + "/" + n + " 則轉傳失敗（已送出 " + sent + " 則到 " + label + "）：" + base : base);
  } finally {
    failWaiters("");
    forwarding = false;
    refreshSend();
  }
}

function openSetup() {
  $("f-url").value = localStorage.getItem(KEY_URL) || "";
  $("f-pin").value = "";
  document.body.dataset.state = "closed";
  $("status").textContent = "未連線";
  if (!setup.open) setup.showModal();
}
setup.addEventListener("cancel", (ev) => ev.preventDefault());
$("setup-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const urlField = $("f-url");
  let base;
  try { base = toWsBase(urlField.value); } catch { base = null; }
  urlField.setCustomValidity(base ? "" : "網址格式不正確");
  if (!ev.target.reportValidity()) return;
  localStorage.setItem(KEY_URL, base);
  localStorage.setItem(KEY_PIN, $("f-pin").value);
  setup.close();
  retry = 0; everOpened = false;
  connect();
});
$("f-url").addEventListener("input", (ev) => ev.target.setCustomValidity(""));

$("reset").addEventListener("click", () => {
  stopped = true;
  clearTimeout(retryTimer);
  if (pending) { clearTimeout(pending.timer); pending = null; }
  if (ws) { ws.close(); ws = null; }
  localStorage.removeItem(KEY_URL);
  localStorage.removeItem(KEY_PIN);
  try { localStorage.removeItem(KEY_CHATS); } catch {}
  retry = 0; everOpened = false; blocked = null;
  render([]);
  media.clear();
  stickerCats = []; stickerCache.clear(); curCat = null; picked = null; stLoading = false;
  if (stickerDlg.open) stickerDlg.close();
  more.disabled = false;
  more.textContent = MORE_TEXT;
  text.value = "";
  clearReply();
  showNotice("");
  chatItems = []; chatsLoaded = false; listNotice = false;
  clip = null; closeMenu();
  clearFileState();
  setChat(null, null, true);
  $("target").textContent = "聊天";
  refreshSend();
  openSetup();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !ws && !stopped) { retry = 0; connect(); }
});

showCachedChats();
connect();
</script>
